<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Header
</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Pacifico&family=Barlow+Condensed:wght@800&display=swap" rel="stylesheet">
<style>
  :root {
    --bar-bg: #8379A8;      /* purple background */
    --bar-fg: #F6F3FB;      /* off-white text/icons */
    --bar-height: 57px;     /* matches screenshot (57px tall) */
    --bar-font-size: 20px;  /* matches screenshot text size */
    --bar-pad-x: 43px;      /* left/right gutter */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { font-family: "Figtree", "Inter", "Helvetica Neue", Arial, sans-serif; }

  /* Announcement Bar section */
  .announcement-bar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    height: 32px;
    padding:0px 24px;
    background: var(--bar-bg);
    color: var(--bar-fg);
    font-size:12px;
    font-weight: 500;
    letter-spacing: 0%;
    text-transform: uppercase;
    line-height: 120%;
  }

  /* LEFT: social icons */
  .announcement-bar__social {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .announcement-bar__social a {
    display: inline-flex;
    color: inherit;
    transition: opacity .2s;
  }
  .announcement-bar__social a:hover { opacity: .75; }
  .announcement-bar__social svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
  }

  /* CENTER: message */
  .announcement-bar__message {
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .announcement-bar__dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
  }
  .announcement-bar__message a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 1.5px;
  }
  .announcement-bar__message a:hover { opacity: .8; }

  /* RIGHT: currency selector */
  .announcement-bar__currency {
    justify-self: end;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding-right: 4px;
    background: none;
    border: 0;
    color: inherit;
    font: inherit;
    letter-spacing: inherit;
    text-transform: none;
    cursor: pointer;
  }
  .announcement-bar__currency svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Tablet + mobile: centered single message, title case, no icons/currency */
  @media (max-width: 768px) {
    :root { --bar-font-size: 14px; --bar-height: 40px; --bar-pad-x: 16px; }
    .announcement-bar {
      grid-template-columns: 1fr;
      justify-items: center;
      text-align: center;
      text-transform: none;      /* "Up to 50% Off Sitewide" */
      letter-spacing: 0;
    }
    .announcement-bar__social,
    .announcement-bar__currency,
    .announcement-bar__shipping,
    .announcement-bar__dot--first { display: none; }
    .announcement-bar__message { gap: 11px; }
    .announcement-bar__dot { width: 4px; height: 4px; }
    .announcement-bar__message a { text-underline-offset: 3px; text-decoration-thickness: 1px; }
  }
  /* Mobile (matches the 375px design: 32px tall, 12px text) */
  @media (max-width: 720px) {
    :root { --bar-font-size: 12px; --bar-height: 32px; }
  }
  /* Keep social icons and currency fixed at the 1800px position on wider screens */
@media (min-width: 1800px) {
  .announcement-bar {
    /* Background stays full width; content is held to an 1800px area, centered */
    padding-left: calc((100% - 1800px) / 2 + var(--bar-pad-x));
    padding-right: calc((100% - 1800px) / 2 + var(--bar-pad-x));
  }
}

  /* =========================================================
     HEADER
     ========================================================= */
  :root {
    --header-bg: #FAF6F3;     /* warm off-white */
    --header-fg: #4A3F8B;     /* deep purple text / icons / logo */
    --header-logo-accent: #8A7FB5;  /* lighter second "l" in the logo */
    --header-height: 57px;
    --header-pad-x: 56px;
  }

  .site-header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    height: var(--header-height);
    padding: 0 var(--header-pad-x);
    background: var(--header-bg);
    color: var(--header-fg);
    font-size: 14px;
    font-weight: 500;
    line-height: 1.2;
  }

  .site-header a { color: inherit; text-decoration: none; }

  /* LEFT: main navigation */
  .site-header__nav {
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .site-header__nav a,
  .site-header__links a { transition: opacity .2s; white-space: nowrap; }
  .site-header__nav a:hover,
  .site-header__links a:hover { opacity: .7; }

  /* CENTER: logo (text-based approximation of the wordmark) */
  .site-header__logo {
    display: inline-flex;
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: 1;
    padding-bottom: 3px;
  }
  .site-header__logo .accent { color: var(--header-logo-accent); }

  /* RIGHT: links + search + cart */
  .site-header__right {
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .site-header__links {
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .site-header__actions {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-left: -3px;
  }
  .site-header__search {
    display: inline-flex;
    background: none;
    border: 0;
    color: inherit;
    cursor: pointer;
  }
  .site-header__search svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
  }

  /* Cart: cloud shape with item count */
  .site-header__cart {
    position: relative;
    display: inline-flex;
    width: 28px;
    height: 20px;
  }
  .site-header__cart svg { width: 100%; height: 100%; fill: currentColor; }
  .site-header__cart-count {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-38%);
    text-align: center;
    color: var(--header-bg);
    font-size: 10px;
    font-weight: 800;
    line-height: 1;
  }

  /* =========================================================
     MEGAMENU (desktop) - panel background matches the design:
     cream at the top fading to soft lavender at the bottom
     ========================================================= */
  .site-header {
    position: sticky;            /* stays at the top of the screen... */
    top: 0;
    z-index: 100;
    transition: transform .3s ease;
  }
  .site-header.is-hidden { transform: translateY(-100%); }   /* ...but slides away while scrolling down */
  @media (prefers-reduced-motion: reduce) {
    .site-header { transition: none; }
  }

  /* Each nav item is as tall as the header so the hover area has no gap */
  .site-header__item {
    display: flex;
    align-items: center;
    height: var(--header-height);
  }

  .megamenu {
    position: absolute;       /* positioned against .site-header */
    top: 100%;
    left: 0;
    width: 100%;
    height: 392px;
    background: linear-gradient(180deg, #FCF8F4 0%, #F4F1F0 45%, #EBE7F3 100%);
    border-radius: 0 0 4px 4px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-4px);
    transition: opacity .2s ease, transform .2s ease, visibility 0s linear .2s;
    pointer-events: none;
  }
  .megamenu__inner {
    height: 100%;
    padding: 40px var(--header-pad-x);
  }

  .site-header__item:hover .megamenu,
  .site-header__item:focus-within .megamenu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
    transition-delay: 0s;
    pointer-events: auto;
  }

  /* Megamenu is desktop only */
  @media (max-width: 1100px) {
    .megamenu { display: none; }
  }

  /* Hamburger menu button (shown on mobile only) */
  .site-header__menu {
    display: none;
    background: none;
    border: 0;
    color: inherit;
    cursor: pointer;
  }
  .site-header__menu svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
  }

  /* Keep header content aligned with the announcement bar on very wide screens */
  @media (min-width: 1800px) {
    .site-header {
      padding-left: calc((100% - 1800px) / 2 + var(--header-pad-x));
      padding-right: calc((100% - 1800px) / 2 + var(--header-pad-x));
    }
  }

  /* Tablet */
  @media (max-width: 1100px) {
    :root { --header-pad-x: 24px; }
    .site-header { font-size: 13px; }
    .site-header__nav,
    .site-header__links,
    .site-header__right { gap: 16px; }
    .site-header__logo { font-size: 32px; }
  }

  /* Mobile: logo left; search, cart and hamburger right */
  @media (max-width: 768px) {
    :root { --header-height: 56px; }
    .site-header {
      grid-template-columns: auto 1fr;
      padding: 0 24px 0 20px;
    }
    .site-header__nav,
    .site-header__links { display: none; }
    .site-header__logo { grid-column: 1; font-size: 32px; }
    .site-header__right { grid-column: 2; gap: 0; }
    .site-header__actions { gap: 17px; margin-left: 0; }
    .site-header__search svg { width: 21px; height: 21px; }
    .site-header__cart { width: 32px; height: 22px; }
    .site-header__cart-count { font-size: 11px; }
    .site-header__menu { display: inline-flex; }
  }

  /* =========================================================
     MOBILE MEGAMENU (full-screen overlay with a menu card)
     ========================================================= */
  .mobile-menu { display: none; }

  @media (max-width: 768px) {
    body.menu-open { overflow: hidden; }

    .mobile-menu {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: block;
      overflow-y: auto;
      padding: 16px 20px;
      background: rgba(0, 0, 0, .58);
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s ease, visibility 0s linear .25s;
    }
    .mobile-menu.is-open {
      opacity: 1;
      visibility: visible;
      transition-delay: 0s;
    }
    .mobile-menu a { color: inherit; text-decoration: none; }

    .mobile-menu__card {
      background: #EDE8E7;
      color: var(--header-fg);
      border-radius: 4px;
      padding: 0 20px 16px;
    }

    /* Top row: logo, search, cart, close */
    .mobile-menu__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      margin-bottom: 8px;
    }
    .mobile-menu__close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      margin-left: -5px;
      background: none;
      border: 0;
      color: inherit;
      cursor: pointer;
    }
    .mobile-menu__close svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
    }

    /* Category tiles (2 columns) */
    .mobile-menu__grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 16px;
    }
    .mobile-menu__tile {
      display: block;
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 500;
    }
    .mobile-menu__img {
      display: block;
      height: 96px;
      border-radius: 10px;
      background-color: #ddd;
      background-size: cover;
      background-position: center;
    }
    .mobile-menu__label {
      display: block;
      margin-top: 8px;
      line-height: 24px;
    }

    /* Divider lines */
    .mobile-menu__rule {
      height: 1.5px;
      background: #C5C3E8;
      margin-top: 13px;
    }

    /* Secondary links */
    .mobile-menu__links {
      display: grid;
      grid-template-columns: 176px 1fr;
      row-gap: 8px;
      padding: 13px 0;
      font-size: 16px;
      font-weight: 500;
      line-height: 24px;
    }

    /* Footer: language, currency, social */
    .mobile-menu__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .mobile-menu__selects { display: flex; align-items: center; gap: 14px; }
    .mobile-menu__select {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: none;
      border: 0;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    .mobile-menu__select svg {
      width: 10px;
      height: 10px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .mobile-menu__social { display: flex; align-items: center; gap: 12px; }
    .mobile-menu__social svg { width: 14px; height: 14px; fill: currentColor; display: block; }
  }

</style>
</head>
<body>

  //announcement-bar beginning section 
  <div class="announcement-bar">

  <!-- Social icons -->
  <div class="announcement-bar__social">
    <a href="#" aria-label="Instagram">
      <svg viewBox="0 0 24 24"><path d="M7.8 2h8.4A5.8 5.8 0 0 1 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8A5.8 5.8 0 0 1 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2Zm0 1.8A4 4 0 0 0 3.8 7.8v8.4a4 4 0 0 0 4 4h8.4a4 4 0 0 0 4-4V7.8a4 4 0 0 0-4-4H7.8Zm8.9 1.4a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2ZM12 6.9a5.1 5.1 0 1 1 0 10.2 5.1 5.1 0 0 1 0-10.2Zm0 1.8a3.3 3.3 0 1 0 0 6.6 3.3 3.3 0 0 0 0-6.6Z"/></svg>
    </a>
    <a href="#" aria-label="Facebook">
      <svg viewBox="0 0 24 24"><path d="M13.5 22v-8.2h2.8l.5-3.3h-3.3V8.4c0-.9.4-1.7 1.8-1.7h1.6V3.8s-1.3-.2-2.6-.2c-2.6 0-4.3 1.6-4.3 4.4v2.5H7v3.3h3V22h3.5Z"/></svg>
    </a>
    <a href="#" aria-label="TikTok">
      <svg viewBox="0 0 24 24"><path d="M16.6 2h-3.2v13.3a2.8 2.8 0 1 1-2.8-2.8c.3 0 .6 0 .8.1V9.3a6 6 0 1 0 5.2 5.9V8.6a7.2 7.2 0 0 0 4.2 1.4V6.8a4.2 4.2 0 0 1-4.2-4.8Z"/></svg>
    </a>
  </div>

  <!-- Message -->
  <div class="announcement-bar__message">
    <span>Up to 50% Off Sitewide</span>
    <span class="announcement-bar__dot announcement-bar__dot--first" aria-hidden="true"></span>
    <span class="announcement-bar__shipping">Free Shipping on Orders Over $120</span>
    <span class="announcement-bar__dot" aria-hidden="true"></span>
    <a href="#">Shop Now</a>
  </div>

  <!-- Currency selector -->
  <button class="announcement-bar__currency" type="button" aria-label="Select currency">
    $ USD
    <svg viewBox="0 0 24 24"><polyline points="5 9 12 16 19 9"/></svg>
  </button>

  
//Header section
<header class="site-header">

  <!-- Left navigation -->
  <nav class="site-header__nav" aria-label="Main">
    <div class="site-header__item">
      <a href="#">Pillows</a>
      <div class="megamenu" aria-label="Pillows">
        <div class="megamenu__inner"><!-- Pillows menu content --></div>
      </div>
    </div>

    <div class="site-header__item">
      <a href="#">Bedding</a>
      <div class="megamenu" aria-label="Bedding">
        <div class="megamenu__inner"><!-- Bedding menu content --></div>
      </div>
    </div>

    <div class="site-header__item">
      <a href="#">Apparel &amp; Accessories</a>
      <div class="megamenu" aria-label="Apparel and Accessories">
        <div class="megamenu__inner"><!-- Apparel & Accessories menu content --></div>
      </div>
    </div>

    <div class="site-header__item">
      <a href="#">Sale</a>
      <div class="megamenu" aria-label="Sale">
        <div class="megamenu__inner"><!-- Sale menu content --></div>
      </div>
    </div>
  </nav>

  <!-- Logo -->
  <a class="site-header__logo" href="#" aria-label="mellow home">me<span>l</span><span class="accent">l</span>ow</a>

  <!-- Right: links, search, cart -->
  <div class="site-header__right">
    <nav class="site-header__links" aria-label="Secondary">
      <a href="#">Our Story</a>
      <a href="#">Sleep Ambassadors</a>
    </nav>

    <div class="site-header__actions">
      <button class="site-header__search" type="button" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="8"/><line x1="16" y1="16" x2="23" y2="23"/></svg>
      </button>

      <a class="site-header__cart" href="#" aria-label="Cart, 1 item">
        <svg viewBox="0 0 40 28"><path d="M10 27H30C35.5 27 39 23.5 39 19C39 14.8 36 11.8 32 11.3C31 5.8 26.5 1 20.5 1C16 1 12.5 3.6 10.8 7.4C5.8 8 2 11.8 2 17C2 22.6 5.2 27 10 27Z"/></svg>
        <span class="site-header__cart-count">1</span>
      </a>

      <button class="site-header__menu" type="button" aria-label="Open menu">
        <svg viewBox="0 0 22 22"><line x1="0" y1="5" x2="22" y2="5"/><line x1="0" y1="11" x2="22" y2="11"/><line x1="0" y1="17" x2="22" y2="17"/></svg>
      </button>
    </div>
  </div>

</header>
</body>
</html>
